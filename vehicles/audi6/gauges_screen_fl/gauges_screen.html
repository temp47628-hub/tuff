<html ng-app="gaugesScreen">
<head>
  <meta charset="UTF-8">
  <script>
    if(typeof beamng !== 'undefined') {
    }
    else{ //for vueService
      var beamng = {}
      beamng.sendEngineLua = function(){}
    }
  </script>
  <!-- Vue START -->
  <script src="/ui/lib/ext/vue3/vue.global.prod.js"></script>
  <script src="/ui/lib/ext/tiny-emitter/tinyemitter.js"></script>
  <script type="module" src="/ui/lib/int/vueService_mod.js"></script>
  <!-- Vue END -->
  <script src="/ui/lib/ext/angular/angular.js"></script>
  <script src="gauges_screen_fl.js"></script>
  <link type="text/css" rel="stylesheet" href="gauges_screen.css">
</head>

<body ng-controller="GaugesScreenController as gaugeCtrl">
  <div class="gauge">
	<div class="line1"></div>
	<div class="line2"></div>
	<div class="line3"></div>
	
	<div class="gear">{{ data.gear }}</div>
	<div class="toptext">{{ data.toptext }}</div>
	
	<div class="odo">{{ data.odo }}</div>
	<div class="trip">{{ data.trip }}</div>
	<div class="distanceUnit">{{ data.distanceUnit }}</div>
	<div class="range" ng-bind-html="data.range"></div>
	<div class="date">{{ data.date }}</div>
	<div class="time">{{ data.time }}</div>
	<div class="temp">{{ data.temp }}</div>
	<div class="climateTemp1">{{ data.climateTemp1 }}</div>
	<div class="climateTempUnit1">{{ data.climateTempUnit1 }}</div>
	<div class="climateTemp2">{{ data.climateTemp2 }}</div>
	<div class="climateTempUnit2">{{ data.climateTempUnit2 }}</div>
	
	<div id="fuel_icon"></div>
	<div id="warning_symbol"></div>
	<div id="warning_symbol_bottom"></div>
    <!--<div class="gaugeText">
      <div >{{data.gaugeText}}</div>
    </div>
	<div class="gaugeText2" ng-bind-html="data.gaugeText2"></div>
	<div class="speedVal" ng-bind-html="data.speedVal"></div>
	
	<div id="range"></div>-->
	
	<div id="door"></div>
	<div id="door_FL"></div>
	<div id="door_FR"></div>
	<div id="door_RL"></div>
	<div id="door_RR"></div>
	
	<div id="hood"></div>
	<div id="trunk"></div>

</body>

</html>
